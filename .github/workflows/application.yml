name: Backend CD
on:
  push:
    branches: [ "release" ]
  pull_request:
    branches: [ "release" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
      
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      # Secrets를 사용해 파일 생성
      - name: Create required files from secrets
        env:
          APPLICATION_YML: ${{ secrets.APPLICATION_YML }}
          JSON_CONFIG: ${{ secrets.JSON_CONFIG }}
        run: |
          mkdir -p src/main/resources
          echo "$APPLICATION_YML" > src/main/resources/application.yml
          echo "$JSON_CONFIG" > src/main/resources/inspired-shell-448000-f5-cfd1d74f35fa.json
      - name: Verify file creation
        run: |
          ls -l src/main/resources
          cat src/main/resources/application.yml
          cat src/main/resources/inspired-shell-448000-f5-cfd1d74f35fa.json

      - name: Clean build directory
        run: ./gradlew clean

      - name: Build Spring Boot application
        run: ./gradlew build

      - name: Build Docker image
        run: docker build -t mafatofu/star-be .

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Docker image to Docker Hub
        run: docker push jinu0125/tourservice

      - name: Deploy to GCP
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_KEY }}
          port: ${{ secrets.GCP_SSH_PORT }}
          script: |
            sudo su
            sudo docker stop $(sudo docker ps -a | grep tourservice | awk '{print $1}') || true
            sudo docker rm $(sudo docker ps -a | grep tourservice | awk '{print $1}') || true
            sudo docker pull jinu0125/tourservice
            sudo docker run -d -p 8080:8080 --name star-be mafatofu/star-be
